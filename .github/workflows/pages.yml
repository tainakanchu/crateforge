name: Deploy Site (LP + Docs) to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "website/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Workflow-level: read-only so fork PRs work without pages: write.
# Deploy job elevates pages/id-token permissions below.
permissions:
  contents: read

concurrency:
  # Keep deploy (push/workflow_dispatch) in its own group so PR builds never
  # share the Pages deploy slot. Cancel superseded PR builds only.
  group: pages-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      # ドキュメント (Astro + Starlight) を website/ でビルド → website/dist。
      - name: Install docs deps
        working-directory: website
        run: pnpm install --frozen-lockfile

      - name: Build docs (Astro + Starlight)
        working-directory: website
        run: pnpm build

      # LP(site/) をルート、ドキュメント(website/dist) を /docs/ 配下に合成する。
      - name: Assemble site (LP at root, docs under /docs)
        run: |
          rm -rf _site
          mkdir -p _site/docs
          cp -r site/. _site/
          cp -r website/dist/. _site/docs/

      # Pages artifact upload is deploy-only (needs pages: write).
      - name: Setup Pages
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
