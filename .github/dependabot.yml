version: 2
updates:
  # website/ (Astro + Starlight). Starlight pins the astro major it supports,
  # so bump astro and @astrojs/* together in a single PR.
  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "weekly"
    groups:
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"

  # GitHub Actions (.github/workflows/*.yml). Actions are pinned to full commit
  # SHAs with the release tag as a trailing comment; Dependabot bumps both.
  # Batch all action updates into one weekly PR.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    ignore:
      # setup-gradle v6 defaults to the proprietary "enhanced" cache provider
      # (gradle-actions-caching). Stay on v5 until we decide on
      # `cache-provider: basic` or accept those terms.
      - dependency-name: "gradle/actions*"
        versions: [">= 6"]
